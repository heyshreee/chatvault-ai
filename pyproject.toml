[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatvault-ai"
version = "1.0.0"
description = "Local-first ChatGPT conversation vault with SQLite, PDF/DOCX export, and retrieval-augmented chat."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "heyshreee" },
]
keywords = [
    "chatgpt",
    "conversation-archive",
    "fastapi",
    "ollama",
    "rag",
    "chromadb",
    "local-first",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "sqlalchemy>=2.0",
    "reportlab>=4.2",
    "python-docx>=1.1",
    "chromadb==1.5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[project.scripts]
chatvault = "run:main"

[project.urls]
Homepage = "https://github.com/heyshreee/chatvault-ai"
Repository = "https://github.com/heyshreee/chatvault-ai"
Issues = "https://github.com/heyshreee/chatvault-ai/issues"
Upstream = "https://github.com/makitdev/chatvault-ai"

[tool.setuptools]
py-modules = ["run"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

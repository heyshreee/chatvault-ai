<!DOCTYPE html>
<html>
<head>
    <title>Learning Nmap - ChatGPT</title>
</head>
<body>

    <div data-message-author-role="user">
        What is Nmap?
    </div>

    <div data-message-author-role="assistant">
        Nmap is a network scanning tool.
    </div>

    <div data-message-author-role="user">
        Give me an example command.
    </div>

    <div data-message-author-role="assistant">
        Try this command:
        <code>nmap -sV 192.168.1.1</code>
    </div>

</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="auto" role="img" aria-label="ChatVault AI Technical Architecture Diagram">
  <defs>
    <style>
      .bg { fill: #FAFAF8; }
      .box { fill: #FFFFFF; stroke: #D3D7CE; stroke-width: 1.5; rx: 6px; }
      .box-truth { fill: #FFFFFF; stroke: #426B55; stroke-width: 2; rx: 6px; }
      .box-derived { fill: #FFFFFF; stroke: #8E948C; stroke-width: 1.5; stroke-dasharray: 4,4; rx: 6px; }
      .title { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; fill: #171A18; }
      .subtitle { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #575D57; }
      .badge-truth { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10px; font-weight: 700; fill: #426B55; }
      .badge-derived { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10px; font-weight: 600; fill: #707570; }
      .arrow { stroke: #426B55; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-muted { stroke: #A2A89F; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-muted); }
      .group-title { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; font-weight: 700; fill: #707570; letter-spacing: 0.05em; text-transform: uppercase; }
      .group-box { fill: #F4F5F1; stroke: #E5E7E2; stroke-width: 1; rx: 8px; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#426B55" />
    </marker>
    <marker id="arrowhead-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#A2A89F" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="620" class="bg" rx="8" />

  <!-- Stage 1: Public Input -->
  <g transform="translate(320, 24)">
    <rect width="280" height="52" class="box" />
    <text x="140" y="24" text-anchor="middle" class="title">ChatGPT Public Share URL</text>
    <text x="140" y="40" text-anchor="middle" class="subtitle">chatgpt.com/share/&lt;id&gt; (No auth / credentials required)</text>
  </g>

  <!-- Arrow down to Backend -->
  <path d="M 460 76 L 460 102" class="arrow" />

  <!-- Stage 2: FastAPI Ingestion Boundary -->
  <g transform="translate(180, 104)">
    <rect width="560" height="124" class="group-box" />
    <text x="20" y="22" class="group-title">FastAPI Backend Boundary (Local HTTP / JSON)</text>

    <!-- Sub-step: Extraction -->
    <g transform="translate(20, 36)">
      <rect width="240" height="64" class="box" />
      <text x="120" y="28" text-anchor="middle" class="title">Conversation Extraction</text>
      <text x="120" y="46" text-anchor="middle" class="subtitle">httpx fetch &amp; BeautifulSoup DOM parsing</text>
    </g>

    <!-- Arrow Extraction -> Chunking -->
    <path d="M 260 68 L 298 68" class="arrow" />

    <!-- Sub-step: Chunking -->
    <g transform="translate(300, 36)">
      <rect width="240" height="64" class="box" />
      <text x="120" y="28" text-anchor="middle" class="title">Message-Aware Chunking</text>
      <text x="120" y="46" text-anchor="middle" class="subtitle">Strict boundaries · Token budgeting</text>
    </g>
  </g>

  <!-- Split Arrows from Chunking to SQLite and Ollama -->
  <!-- Branch Left to SQLite -->
  <path d="M 300 172 L 210 172 L 210 266" class="arrow" />
  <!-- Branch Right to Ollama -->
  <path d="M 620 172 L 710 172 L 710 266" class="arrow" />

  <!-- Stage 3A: Storage Architecture (Left Column: SQLite Source of Truth) -->
  <g transform="translate(70, 268)">
    <rect width="280" height="142" class="box-truth" />
    <rect x="14" y="14" width="136" height="20" rx="3" fill="#EBF2ED" />
    <text x="82" y="28" text-anchor="middle" class="badge-truth">SOURCE OF TRUTH</text>
    <text x="140" y="58" text-anchor="middle" class="title">SQLite Database</text>
    <text x="140" y="78" text-anchor="middle" class="subtitle">storage/chatvault.db via SQLAlchemy 2</text>
    <text x="140" y="98" text-anchor="middle" class="subtitle">Conversations, messages &amp; import metadata</text>
    <text x="140" y="118" text-anchor="middle" class="subtitle">Single process-wide indexing lock</text>
  </g>

  <!-- Export path from SQLite -->
  <path d="M 210 410 L 210 468" class="arrow-muted" />

  <g transform="translate(70, 470)">
    <rect width="280" height="74" class="box" />
    <text x="140" y="28" text-anchor="middle" class="title">Document Generation</text>
    <text x="140" y="46" text-anchor="middle" class="subtitle">ReportLab (PDF) &amp; python-docx (DOCX)</text>
    <text x="140" y="62" text-anchor="middle" class="subtitle">Stored in storage/generated/</text>
  </g>

  <!-- Stage 3B: AI & Embeddings (Right Column) -->
  <g transform="translate(570, 268)">
    <rect width="280" height="64" class="box" />
    <text x="140" y="28" text-anchor="middle" class="title">Ollama Embeddings</text>
    <text x="140" y="46" text-anchor="middle" class="subtitle">nomic-embed-text (Local inference)</text>
  </g>

  <!-- Arrow Ollama -> ChromaDB -->
  <path d="M 710 332 L 710 364" class="arrow" />

  <!-- ChromaDB: Derived Vector Index -->
  <g transform="translate(570, 366)">
    <rect width="280" height="80" class="box-derived" />
    <rect x="14" y="12" width="170" height="18" rx="3" fill="#F4F5F1" />
    <text x="99" y="25" text-anchor="middle" class="badge-derived">DERIVED &amp; REBUILDABLE INDEX</text>
    <text x="140" y="48" text-anchor="middle" class="title">ChromaDB Vector Store</text>
    <text x="140" y="66" text-anchor="middle" class="subtitle">Cosine distance · Can be rebuilt from SQLite</text>
  </g>

  <!-- Arrow ChromaDB -> RAG Retrieval -->
  <path d="M 710 446 L 710 478" class="arrow" />

  <!-- Stage 4: RAG Retrieval & LLM Generation -->
  <g transform="translate(570, 480)">
    <rect width="280" height="116" class="box" />
    <text x="140" y="26" text-anchor="middle" class="title">RAG Retrieval &amp; Chat</text>
    <text x="140" y="44" text-anchor="middle" class="subtitle">Semantic similarity query across chunks</text>
    <path d="M 20 54 L 260 54" stroke="#E5E7E2" stroke-width="1" />
    <text x="140" y="74" text-anchor="middle" class="title">Ollama LLM (llama3.2:3b)</text>
    <text x="140" y="94" text-anchor="middle" class="subtitle">Local RAG synthesis with numbered citations</text>
  </g>

  <!-- Query input into RAG Retrieval -->
  <g transform="translate(380, 510)">
    <rect width="160" height="56" class="box" />
    <text x="80" y="24" text-anchor="middle" class="title">User Query</text>
    <text x="80" y="42" text-anchor="middle" class="subtitle">POST /api/v1/chat</text>
  </g>
  <path d="M 540 538 L 568 538" class="arrow" />

  <!-- Verification Link: SQLite to RAG for chunk metadata validation -->
  <path d="M 350 339 L 460 339 L 460 488 L 568 488" class="arrow-muted" />
  <text x="440" y="415" text-anchor="middle" class="subtitle" transform="rotate(-90 440 415)">Source text verified from SQLite</text>
</svg>
